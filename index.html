<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An endless isometric city builder with a river, bridges, lakehouses, moving cars, and light and dark themes."
    />
    <meta name="theme-color" content="#e9e9e5" />
    <script>
      try {
        const dark = localStorage.getItem("isocity:theme") === "dark"
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute("content", dark ? "#17181b" : "#e9e9e5")
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>iso.city — an endless isometric city</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow mono"><span class="brand-mark" aria-hidden="true"></span>iso.city</p>
          <h1>A simple city</h1>
          <p class="lede">An endless paper grid. Build along the river, or auto-build a district.</p>
        </div>

        <div class="meta">
          <div class="stats" aria-live="polite">
            <div class="stat">
              <span class="label mono">built</span>
              <span class="value mono" id="built-count">00</span>
            </div>
            <div class="stat">
              <span class="label mono">people</span>
              <span class="value mono" id="pop-count">000</span>
            </div>
          </div>
          <span class="save mono" id="save-status">
            <span class="dot" aria-hidden="true"></span>
            <span id="save-label">saved</span>
          </span>
          <div class="actions">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme (T)">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
              </svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z" />
              </svg>
            </button>
            <button
              class="generate"
              id="generate"
              type="button"
              title="Fill a 17×17 district with streets, bridges, houses, towers, and trees (G)"
              aria-label="Auto-build a district"
            >
              Auto-build
            </button>
            <button class="clear" id="clear" type="button" title="Clear all buildings, roads, and trees" aria-label="Clear all buildings, roads, and trees">Clear</button>
          </div>
        </div>
      </header>

      <main class="stage">
        <svg
          id="city"
          viewBox="-500 -90 1000 500"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="Endless isometric city grid"
        >
          <title>Endless isometric city grid</title>
          <defs>
            <pattern id="isogrid" width="64" height="32" patternUnits="userSpaceOnUse">
              <rect width="64" height="32" fill="var(--land)" />
              <polygon points="0,0 32,0 0,16" fill="var(--land)" stroke="var(--grid)" stroke-width="0.65" />
              <polygon points="64,0 32,0 64,16" fill="var(--land)" stroke="var(--grid)" stroke-width="0.65" />
              <polygon points="0,32 0,16 32,32" fill="var(--land)" stroke="var(--grid)" stroke-width="0.65" />
              <polygon points="64,32 64,16 32,32" fill="var(--land)" stroke="var(--grid)" stroke-width="0.65" />
              <polygon points="32,0 64,16 32,32 0,16" fill="var(--land)" stroke="var(--grid)" stroke-width="0.65" />
            </pattern>
          </defs>
          <rect id="ground" x="-10000" y="-10000" width="20000" height="20000" fill="url(#isogrid)" />
          <g id="flats"></g>
          <g id="cars" pointer-events="none"></g>
          <g id="objects"></g>
          <g id="hover" pointer-events="none"></g>
          <g id="ghost" class="ghost" pointer-events="none"></g>
        </svg>

        <div class="view-controls" role="group" aria-label="View controls">
          <button class="view-button" id="pan-toggle" type="button" aria-pressed="false" aria-label="Pan the canvas" title="Pan the canvas (H)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 11V6a2 2 0 0 0-4 0v5" />
              <path d="M14 10V4a2 2 0 0 0-4 0v2" />
              <path d="M10 10.5V6a2 2 0 0 0-4 0v8" />
              <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
            </svg>
          </button>
          <button class="view-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <button class="zoom-value mono" id="zoom-reset" type="button" aria-label="Reset view" title="Reset view">100%</button>
          <button class="view-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        </div>

        <p class="stage-hint mono" aria-hidden="true">Space + drag to pan · Scroll or pinch to zoom</p>
      </main>

      <footer class="dock">
        <div class="tools" role="toolbar" aria-label="Build tools">
          <button class="tool" type="button" data-tool="road" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z" />
                <path d="M8 8.5 16 15.5" />
                <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
              </svg>
            </span>
            <span class="tool-label">Road</span>
            <kbd class="key mono">1</kbd>
          </button>

          <button class="tool" type="button" data-tool="house" aria-pressed="true">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.5 19.5 6.5 12 10.5 4.5 6.5 12 2.5Z" fill="currentColor" fill-opacity=".18" />
                <path d="M4.5 6.5v7L12 18l7.5-4.5v-7" />
                <path d="M12 10.5V18" />
              </svg>
            </span>
            <span class="tool-label">House</span>
            <kbd class="key mono">2</kbd>
          </button>

          <button class="tool" type="button" data-tool="tower" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2 18 5.5 12 9 6 5.5 12 2Z" />
                <path d="M6 5.5V18l6 3.5 6-3.5V5.5" />
                <path d="M12 9v12.5" />
                <path d="M9 12.5v2M15 12.5v2" />
              </svg>
            </span>
            <span class="tool-label">Tower</span>
            <kbd class="key mono">3</kbd>
          </button>

          <button class="tool" type="button" data-tool="tree" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.5 19 9.5 12 12 5 9.5 12 2.5Z" />
                <path d="M12 12v9" />
                <path d="M8 21h8" />
              </svg>
            </span>
            <span class="tool-label">Tree</span>
            <kbd class="key mono">4</kbd>
          </button>

          <button class="tool" type="button" data-tool="water" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z" />
                <path d="M7.5 12.5c1.4-1.1 2.8-1.1 4.2 0s2.8 1.1 4.2 0" />
                <path d="M7.5 15.5c1.4-1.1 2.8-1.1 4.2 0s2.8 1.1 4.2 0" />
              </svg>
            </span>
            <span class="tool-label">Water</span>
            <kbd class="key mono">W</kbd>
          </button>

          <button class="tool" type="button" data-tool="erase" aria-pressed="false">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5 20.5 12 12 20.5 3.5 12 12 3.5Z" />
                <path d="m9 9 6 6M15 9l-6 6" />
              </svg>
            </span>
            <span class="tool-label">Erase</span>
            <kbd class="key mono">X</kbd>
          </button>
        </div>

        <p class="dock-hint">Click to build · drag to paint · right-click to clear</p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
